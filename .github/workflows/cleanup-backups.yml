name: Cleanup old backup sheets

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Удалить _backup_* старше N дней'
        required: false
        default: '60'
  schedule:
    # Раз в неделю, по воскресеньям в 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-auth-httplib2

      - name: Cleanup old backups
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:          ${{ secrets.SPREADSHEET_ID }}
          CLEANUP_DAYS:            ${{ github.event.inputs.days || '60' }}
        run: python cleanup_backups.py
