<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление контентом — Админ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4ff;
            color: #1a202c;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,20,80,0.08);
            padding: 30px 35px 40px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover { text-decoration: underline; }

        /* Панель управления */
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .toolbar select, .toolbar input {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 14px;
            background: white;
            font-family: 'Inter', sans-serif;
        }
        .toolbar .spacer { flex: 1; }
        .toolbar button {
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-danger:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-secondary:hover { background: #475569; }

        .selected-info {
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
        }

        /* Таблица контента */
        .content-table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
        }
        .content-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .content-table thead th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
            font-size: 13px;
            text-align: left;
            padding: 10px 10px 8px;
            border-bottom: 2px solid #e2e8f0;
            vertical-align: top;
        }
        .content-table thead th .th-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            padding: 4px 0;
            transition: color 0.15s;
        }
        .content-table thead th .th-label:hover { color: #2563eb; }
        .content-table thead th .sort-icon {
            font-size: 11px;
            color: #94a3b8;
        }
        .content-table thead th .sort-icon.active { color: #2563eb; }
        .content-table thead th .col-search {
            width: 100%;
            padding: 5px 8px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            background: white;
            box-sizing: border-box;
        }
        .content-table thead th .col-search:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
        }
        .content-table tbody td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            color: #334155;
            vertical-align: middle;
        }
        .content-table tbody tr:hover { background: #f8fafc; }
        .content-table tbody tr:last-child td { border-bottom: none; }
        .content-table td.center { text-align: center; }
        .content-table td.title-cell { font-weight: 600; color: #0f172a; }
        .content-table th.center { text-align: center; width: 40px; }

        .checkbox-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .empty-block {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-style: italic;
        }

        /* Инфо о токене */
        .token-info {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .token-info.hidden { display: none; }
        .token-info button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .content-table { font-size: 12px; }
            .content-table thead th, .content-table tbody td { padding: 6px 4px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="admin/"><i class="fas fa-arrow-left"></i> Вернуться в админку</a>
        <a href="index.html"><i class="fas fa-home"></i> На главную</a>
        <a href="admin-downloads.html"><i class="fas fa-download"></i> История скачиваний</a>
    </div>

    <h1><i class="fas fa-database" style="color:#8b5cf6;"></i> Управление контентом</h1>
    <p class="subtitle">Все записи из таблицы наполнения. Можно выбрать и удалить ненужные.</p>

    <div id="tokenWarning" class="token-info hidden">
        <span><i class="fas fa-key"></i> Для удаления контента нужен GitHub Personal Access Token.</span>
        <button onclick="askToken()">Ввести токен</button>
    </div>

    <div class="toolbar">
        <select id="sectionFilter">
            <option value="all">Все разделы</option>
            <option value="programs">Программы</option>
            <option value="books">Книги</option>
            <option value="news">Новости</option>
            <option value="articles">Статьи</option>
            <option value="movies">Фильмы</option>
            <option value="music">Музыка</option>
            <option value="games">Игры</option>
            <option value="misc">Разное</option>
        </select>
        <button class="btn-secondary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Обновить</button>
        <span class="spacer"></span>
        <span class="selected-info" id="selectedInfo" style="display:none;"></span>
        <button class="btn-danger" id="deleteSelectedBtn" disabled><i class="fas fa-trash"></i> Удалить выбранные</button>
    </div>

    <div class="content-table-wrapper">
        <table class="content-table" id="contentTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="20" class="empty-block"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://rmoonebbvpmvthvpcmpt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tr2OeCNsnhEeOTw7-Y3yLw_OGCYtWHW';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const GITHUB_OWNER = 'DimonMaxx';
    const GITHUB_REPO = 'my-site';
    const WORKFLOW_ID = 'delete-content.yml';

    // Описание колонок для каждого раздела
    const SECTIONS = {
        programs: { file: '_content/programs.json', label: 'Программы', columns: ['title', 'description', 'version', 'size', 'download_link'] },
        books:    { file: '_content/books.json',    label: 'Книги',     columns: ['title', 'author', 'description', 'format', 'download_link'] },
        news:     { file: '_content/news.json',     label: 'Новости',   columns: ['title', 'date', 'body'] },
        articles: { file: '_content/articles.json', label: 'Статьи',    columns: ['title', 'date', 'body'] },
        movies:   { file: '_content/movies.json',   label: 'Фильмы',    columns: ['title', 'year', 'description', 'download_link'] },
        music:    { file: '_content/music.json',    label: 'Музыка',    columns: ['title', 'artist', 'year', 'description', 'download_link'] },
        games:    { file: '_content/games.json',    label: 'Игры',      columns: ['title', 'platform', 'year', 'description', 'download_link'] },
        misc:     { file: '_content/misc.json',     label: 'Разное',    columns: ['title', 'description', 'download_link'] },
    };

    const COLUMN_LABELS = {
        title: 'Название',
        description: 'Описание',
        version: 'Версия',
        size: 'Размер (МБ)',
        download_link: 'Ссылка',
        author: 'Автор',
        format: 'Формат',
        date: 'Дата',
        body: 'Текст',
        year: 'Год',
        artist: 'Исполнитель',
        platform: 'Платформа',
    };

    let allData = [];       // [{section, rowIndex, data}, ...]
    let tableStates = {};   // { section: {sortKey, sortDir, searches} }
    let currentSection = 'all';
    let currentUser = null;
    let currentProfile = null;

    // ==== Проверка авторизации ====
    async function checkAuth() {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error || !data?.user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = data.user;
        const { data: profile, error: profError } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();
        if (profError || profile?.role !== 'admin') {
            alert('Доступ запрещён.');
            window.location.href = 'index.html';
            return;
        }
        currentProfile = profile;
        await loadAllContent();
    }

    // ==== Загрузка всех JSON ====
    async function loadAllContent() {
        allData = [];
        const sections = Object.keys(SECTIONS);
        for (const section of sections) {
            try {
                const url = SECTIONS[section].file + '?t=' + Date.now();
                const resp = await fetch(url);
                if (!resp.ok) continue;
                const items = await resp.json();
                items.forEach((item, idx) => {
                    allData.push({
                        section: section,
                        sectionLabel: SECTIONS[section].label,
                        rowIndex: idx,
                        data: item
                    });
                });
            } catch (e) {
                console.error(`Ошибка загрузки ${section}:`, e);
            }
        }
        console.log('Загружено записей:', allData.length);
        renderTable();
    }

    // ==== Фильтрация, сортировка, поиск ====
    function getFilteredData() {
        let data = allData.slice();

        // Фильтр по разделу
        if (currentSection !== 'all') {
            data = data.filter(item => item.section === currentSection);
        }

        // Поиск по колонкам
        const state = tableStates[currentSection] || { searches: {} };
        Object.keys(state.searches || {}).forEach(key => {
            const q = (state.searches[key] || '').trim().toLowerCase();
            if (!q) return;
            data = data.filter(item => {
                const val = item.data[key];
                return val !== undefined && String(val).toLowerCase().includes(q);
            });
        });

        // Сортировка
        if (state.sortKey) {
            const key = state.sortKey;
            const dir = state.sortDir === 'asc' ? 1 : -1;
            data.sort((a, b) => {
                const va = a.data[key];
                const vb = b.data[key];
                if (va === undefined) return 1;
                if (vb === undefined) return -1;
                // числа
                if (!isNaN(va) && !isNaN(vb) && va !== '' && vb !== '') {
                    return (parseFloat(va) - parseFloat(vb)) * dir;
                }
                return String(va).localeCompare(String(vb), 'ru') * dir;
            });
        }

        return data;
    }

    // ==== Рендер таблицы ====
    function renderTable() {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');

        // Определяем колонки для текущего фильтра
        let columns;
        if (currentSection === 'all') {
            columns = ['sectionLabel', 'title', 'description'];
        } else {
            columns = ['_checkbox', ...SECTIONS[currentSection].columns];
        }

        // Инициализация состояния
        if (!tableStates[currentSection]) {
            tableStates[currentSection] = { sortKey: null, sortDir: 'asc', searches: {} };
        }
        const state = tableStates[currentSection];

        // Заголовок
        let headHtml = '<tr>';
        columns.forEach(col => {
            if (col === '_checkbox') {
                headHtml += `<th class="center"><input type="checkbox" id="selectAllCheckbox" title="Выбрать все"></th>`;
            } else {
                const label = COLUMN_LABELS[col] || col;
                const isSorted = state.sortKey === col;
                let icon = '<i class="fas fa-sort sort-icon"></i>';
                if (isSorted) {
                    icon = state.sortDir === 'asc'
                        ? '<i class="fas fa-sort-up sort-icon active"></i>'
                        : '<i class="fas fa-sort-down sort-icon active"></i>';
                }
                headHtml += `<th>
                    <div class="th-label" data-sort-key="${col}">${label} ${icon}</div>
                    <input type="text" class="col-search" data-search-key="${col}" placeholder="Поиск..." value="${escapeAttr(state.searches[col] || '')}">
                </th>`;
            }
        });
        headHtml += '</tr>';
        thead.innerHTML = headHtml;

        // Тело
        const filtered = getFilteredData();
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty-block">Ничего не найдено</td></tr>`;
            updateDeleteButton();
            return;
        }

        let bodyHtml = '';
        filtered.forEach(item => {
            const uid = `${item.section}_${item.rowIndex}`;
            bodyHtml += `<tr data-uid="${escapeAttr(uid)}" data-section="${escapeAttr(item.section)}" data-row-index="${item.rowIndex}">`;
            columns.forEach(col => {
                if (col === '_checkbox') {
                    bodyHtml += `<td class="center checkbox-cell"><input type="checkbox" class="row-checkbox" data-uid="${escapeAttr(uid)}"></td>`;
                } else {
                    const val = item.data[col];
                    if (col === 'download_link' && val) {
                        bodyHtml += `<td><a href="${escapeAttr(val)}" target="_blank" style="color:#2563eb;">Скачать</a></td>`;
                    } else if (col === 'title') {
                        bodyHtml += `<td class="title-cell">${escapeHtml(val || '')}</td>`;
                    } else {
                        const shortVal = val ? String(val).slice(0, 100) + (String(val).length > 100 ? '...' : '') : '';
                        bodyHtml += `<td title="${escapeAttr(val || '')}">${escapeHtml(shortVal)}</td>`;
                    }
                }
            });
            bodyHtml += '</tr>';
        });
        tbody.innerHTML = bodyHtml;

        // Обработчики сортировки
        thead.querySelectorAll('.th-label').forEach(el => {
            el.addEventListener('click', function() {
                const key = this.dataset.sortKey;
                if (state.sortKey === key) {
                    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sortKey = key;
                    state.sortDir = 'asc';
                }
                renderTable();
            });
        });

        // Обработчики поиска
        thead.querySelectorAll('.col-search').forEach(input => {
            input.addEventListener('input', function() {
                const key = this.dataset.searchKey;
                state.searches[key] = this.value;
                clearTimeout(input._timer);
                input._timer = setTimeout(() => {
                    renderTable();
                    const newInput = thead.querySelector(`.col-search[data-search-key="${key}"]`);
                    if (newInput) {
                        newInput.focus();
                        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
                    }
                }, 250);
            });
        });

        // Выбор всех
        const selectAll = document.getElementById('selectAllCheckbox');
        if (selectAll) {
            selectAll.addEventListener('change', function() {
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = this.checked);
                updateDeleteButton();
            });
        }

        // Чекбоксы строк
        document.querySelectorAll('.row-checkbox').forEach(cb => {
            cb.addEventListener('change', updateDeleteButton);
        });

        updateDeleteButton();
    }

    function getSelected() {
        const selected = [];
        document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
            const tr = cb.closest('tr');
            selected.push({
                uid: tr.dataset.uid,
                section: tr.dataset.section,
                rowIndex: parseInt(tr.dataset.rowIndex)
            });
        });
        return selected;
    }

    function updateDeleteButton() {
        const selected = getSelected();
        const btn = document.getElementById('deleteSelectedBtn');
        const info = document.getElementById('selectedInfo');
        if (selected.length > 0) {
            btn.disabled = false;
            info.textContent = `Выбрано: ${selected.length}`;
            info.style.display = 'inline';
        } else {
            btn.disabled = true;
            info.style.display = 'none';
        }

        const allCb = document.querySelectorAll('.row-checkbox');
        const selectAll = document.getElementById('selectAllCheckbox');
        if (selectAll && allCb.length > 0) {
            selectAll.checked = selected.length === allCb.length;
        }
    }

    // ==== Токен GitHub ====
    function getToken() {
        return localStorage.getItem('github_token') || '';
    }

    function askToken() {
        const t = prompt('Вставьте GitHub Personal Access Token (с правами workflow и repo):');
        if (t && t.trim()) {
            localStorage.setItem('github_token', t.trim());
            updateTokenWarning();
        }
    }

    function updateTokenWarning() {
        const warning = document.getElementById('tokenWarning');
        if (getToken()) {
            warning.classList.add('hidden');
        } else {
            warning.classList.remove('hidden');
        }
    }

    // ==== Удаление ====
    async function deleteSelected() {
        const token = getToken();
        if (!token) {
            alert('Сначала введите GitHub Personal Access Token.');
            askToken();
            return;
        }

        const selected = getSelected();
        if (selected.length === 0) return;

        // Группируем по разделам
        const bySection = {};
        selected.forEach(s => {
            if (!bySection[s.section]) bySection[s.section] = [];
            bySection[s.section].push(s.rowIndex);
        });

        const message = `Удалить ${selected.length} записей?\n\n` +
            Object.keys(bySection).map(sec =>
                `${SECTIONS[sec].label}: ${bySection[sec].length} шт.`
            ).join('\n');

        if (!confirm(message)) return;

        // Формируем данные для workflow
        const toDelete = selected.map(s => ({
            section: s.section,
            title: s.title || allData.find(d => d.section === s.section && d.rowIndex === s.rowIndex)?.data?.title || ''
        }));

        // Отправляем запрос на GitHub API
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`;
        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        delete_list: JSON.stringify(toDelete)
                    }
                })
            });

            if (resp.status === 204) {
                alert('Запрос на удаление отправлен. Через 1-2 минуты данные обновятся.');
            } else {
                const text = await resp.text();
                alert(`Ошибка GitHub API: ${resp.status}\n${text}`);
            }
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ==== Инициализация ====
    document.getElementById('sectionFilter').addEventListener('change', function() {
        currentSection = this.value;
        renderTable();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadAllContent);
    document.getElementById('deleteSelectedBtn').addEventListener('click', deleteSelected);

    updateTokenWarning();
    checkAuth();
</script>
</body>
</html>
