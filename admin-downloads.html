<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История скачиваний — Админ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4ff;
            color: #1a202c;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,20,80,0.08);
            padding: 30px 35px 40px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 10px;
            background: #f8fafc;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }
        th.center { text-align: center; width: 40px; }
        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
        }
        td.center { text-align: center; }
        tr:hover td { background: #f8fafc; }
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-style: italic;
        }
        .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        .delete-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .filters input, .filters select {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 30px;
            font-size: 14px;
            background: white;
        }
        .filters .spacer { flex: 1; }
        .checkbox-cell {
            text-align: center;
        }
        .checkbox-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .selected-info {
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            table { font-size: 12px; }
            td, th { padding: 6px 4px; }
            .nav-links { flex-direction: column; gap: 10px; }
            .filters { flex-direction: column; align-items: stretch; }
            .filters .spacer { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="admin/"><i class="fas fa-arrow-left"></i> Вернуться в админку</a>
        <a href="index.html"><i class="fas fa-home"></i> На главную</a>
    </div>

    <h1><i class="fas fa-download" style="color:#8b5cf6;"></i> История скачиваний</h1>
    <p class="subtitle">Все скачивания файлов пользователями (только для администратора)</p>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Поиск по названию или пользователю...">
        <select id="filterPeriod">
            <option value="all">Все время</option>
            <option value="today">Сегодня</option>
            <option value="week">За неделю</option>
            <option value="month">За месяц</option>
        </select>
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Обновить</button>
        <span class="spacer"></span>
        <span class="selected-info" id="selectedInfo" style="display:none;"></span>
        <button class="delete-btn" id="deleteSelectedBtn" disabled><i class="fas fa-trash"></i> Удалить выбранные</button>
        <button class="delete-btn" id="deleteAllBtn"><i class="fas fa-trash-alt"></i> Удалить все</button>
    </div>

    <div id="logsContainer">
        <table>
            <thead>
                <tr>
                    <th class="center"><input type="checkbox" id="selectAllCheckbox" title="Выбрать все"></th>
                    <th>Название файла</th>
                    <th>Пользователь</th>
                    <th>Дата и время</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr><td colspan="4" class="empty"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://rmoonebbvpmvthvpcmpt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tr2OeCNsnhEeOTw7-Y3yLw_OGCYtWHW';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allLogs = [];
    let filteredLogs = [];
    let currentUser = null;
    let currentProfile = null;

    async function checkAuth() {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error || !data?.user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = data.user;
        const { data: profile, error: profError } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();
        if (profError || profile?.role !== 'admin') {
            alert('Доступ запрещён. Только администраторы могут видеть эту страницу.');
            window.location.href = 'index.html';
            return;
        }
        currentProfile = profile;
        loadLogs();
    }

    async function loadLogs() {
        try {
            const { data, error } = await supabaseClient
                .from('download_logs')
                .select('*')
                .order('downloaded_at', { ascending: false });
            if (error) throw error;
            allLogs = data || [];
            // Сброс выделений при загрузке
            const selectAll = document.getElementById('selectAllCheckbox');
            if (selectAll) selectAll.checked = false;
            applyFilters();
        } catch (error) {
            console.error('Ошибка загрузки логов:', error);
            document.getElementById('logsTableBody').innerHTML = '<tr><td colspan="4" class="empty">Ошибка загрузки. Попробуйте позже.</td></tr>';
        }
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        const period = document.getElementById('filterPeriod').value;
        const now = new Date();

        filteredLogs = allLogs.filter(log => {
            if (search) {
                const fileName = (log.file_name || '').toLowerCase();
                const fileId = (log.file_id || '').toLowerCase();
                const username = (log.username || '').toLowerCase();
                if (!fileName.includes(search) && !fileId.includes(search) && !username.includes(search)) {
                    return false;
                }
            }
            if (period !== 'all') {
                const logDate = new Date(log.downloaded_at);
                let diffDays = (now - logDate) / (1000 * 60 * 60 * 24);
                if (period === 'today' && diffDays >= 1) return false;
                if (period === 'week' && diffDays >= 7) return false;
                if (period === 'month' && diffDays >= 30) return false;
            }
            return true;
        });

        renderTable(filteredLogs);
    }

    function renderTable(logs) {
        const tbody = document.getElementById('logsTableBody');
        if (!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty">Нет записей о скачиваниях</td></tr>';
            updateDeleteButton();
            return;
        }
        let html = '';
        logs.forEach(log => {
            const date = new Date(log.downloaded_at);
            const dateStr = date.toLocaleDateString('ru-RU') + ' ' + date.toLocaleTimeString('ru-RU');
            const displayName = log.file_name || log.file_id || 'Без названия';
            html += `<tr>
                <td class="center"><input type="checkbox" class="log-checkbox" data-id="${log.id}"></td>
                <td><strong>${escapeHtml(displayName)}</strong></td>
                <td>${escapeHtml(log.username || 'Неизвестный')}</td>
                <td>${dateStr}</td>
            </tr>`;
        });
        tbody.innerHTML = html;

        // Обработчики чекбоксов
        document.querySelectorAll('.log-checkbox').forEach(cb => {
            cb.addEventListener('change', updateDeleteButton);
        });

        updateDeleteButton();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getSelectedIds() {
        const ids = [];
        document.querySelectorAll('.log-checkbox:checked').forEach(cb => {
            ids.push(parseInt(cb.dataset.id));
        });
        return ids;
    }

    function updateDeleteButton() {
        const selected = getSelectedIds();
        const btn = document.getElementById('deleteSelectedBtn');
        const info = document.getElementById('selectedInfo');
        if (selected.length > 0) {
            btn.disabled = false;
            info.textContent = `Выбрано: ${selected.length}`;
            info.style.display = 'inline';
        } else {
            btn.disabled = true;
            info.style.display = 'none';
        }

        // Обновляем состояние "выбрать все"
        const allCheckboxes = document.querySelectorAll('.log-checkbox');
        const selectAll = document.getElementById('selectAllCheckbox');
        if (allCheckboxes.length > 0 && selectAll) {
            selectAll.checked = selected.length === allCheckboxes.length;
        }
    }

    async function deleteSelected() {
        const ids = getSelectedIds();
        if (ids.length === 0) return;
        if (!confirm(`Удалить ${ids.length} записей?`)) return;
        try {
            const { error } = await supabaseClient
                .from('download_logs')
                .delete()
                .in('id', ids);
            if (error) throw error;
            await loadLogs();
        } catch (error) {
            console.error('Ошибка удаления:', error);
            alert('Не удалось удалить записи: ' + error.message);
        }
    }

    async function deleteAll() {
        if (!confirm('Удалить ВСЕ записи истории скачиваний? Это действие необратимо.')) return;
        try {
            const { error } = await supabaseClient
                .from('download_logs')
                .delete()
                .neq('id', 0); // удаляем всё, кроме несуществующего id=0
            if (error) throw error;
            await loadLogs();
        } catch (error) {
            console.error('Ошибка удаления всех записей:', error);
            alert('Не удалось удалить все записи: ' + error.message);
        }
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterPeriod').addEventListener('change', applyFilters);
    document.getElementById('refreshBtn').addEventListener('click', loadLogs);
    document.getElementById('deleteSelectedBtn').addEventListener('click', deleteSelected);
    document.getElementById('deleteAllBtn').addEventListener('click', deleteAll);

    document.getElementById('selectAllCheckbox').addEventListener('change', function() {
        const checked = this.checked;
        document.querySelectorAll('.log-checkbox').forEach(cb => {
            cb.checked = checked;
        });
        updateDeleteButton();
    });

    checkAuth();
</script>
</body>
</html>
