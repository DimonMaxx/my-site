<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4ff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,20,80,0.08);
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #0f172a; }
        .subtitle { color: #64748b; font-size: 15px; margin-bottom: 30px; }
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #475569;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload { font-size: 14px; color: #2563eb; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #1e293b; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            background: #f8fafc;
            transition: border 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary {
            background: #64748b;
        }
        .btn-secondary:hover { background: #475569; }
        .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .buttons-row button { flex: 1; min-width: 120px; }
        .back-link { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .msg { display: none; padding: 12px; border-radius: 12px; margin-top: 15px; }
        .msg.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>👤 Личный кабинет</h1>
    <p class="subtitle">Управляйте своими данными</p>

    <div class="avatar-section">
        <div class="avatar" id="avatarDisplay">
            <i class="fas fa-user"></i>
        </div>
        <div>
            <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera"></i> Загрузить аватар
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
        </div>
    </div>

    <form id="profileForm">
        <div class="form-group">
            <label>Имя пользователя (ник)</label>
            <input type="text" id="profileUsername" required>
        </div>
        <div class="form-group">
            <label>Полное имя</label>
            <input type="text" id="profileFullName">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="profileEmail" required>
        </div>
        <button type="submit" class="btn-primary">Сохранить изменения</button>
        <div id="profileMsg" class="msg"></div>
    </form>

    <div class="buttons-row">
        <button id="changePasswordBtn" class="btn-secondary">Сменить пароль</button>
        <button id="logoutBtn" class="btn-danger">Выйти</button>
    </div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> На главную</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rmoonebbvpmvthvpcmpt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tr2OeCNsnhEeOTw7-Y3yLw_OGCYtWHW';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;

    // Проверка авторизации
    async function checkAuth() {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error || !data?.user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = data.user;
        // Загружаем профиль
        const { data: profile, error: profError } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();
        if (profError) {
            console.error('Ошибка загрузки профиля:', profError);
            return;
        }
        currentProfile = profile;
        fillForm(profile);
        updateAvatar(profile.avatar_url);
    }

    function fillForm(profile) {
        document.getElementById('profileUsername').value = profile.username || '';
        document.getElementById('profileFullName').value = profile.full_name || '';
        document.getElementById('profileEmail').value = currentUser.email || '';
    }

    function updateAvatar(url) {
        const display = document.getElementById('avatarDisplay');
        if (url) {
            display.innerHTML = `<img src="${url}" alt="avatar">`;
        } else {
            display.innerHTML = '<i class="fas fa-user"></i>';
        }
    }

    // Сохранение профиля
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('profileUsername').value.trim();
        const fullName = document.getElementById('profileFullName').value.trim();
        const msg = document.getElementById('profileMsg');
        msg.className = 'msg';
        msg.style.display = 'none';

        if (!username) {
            msg.textContent = 'Имя пользователя обязательно.';
            msg.className = 'msg error';
            msg.style.display = 'block';
            return;
        }

        const { error } = await supabaseClient
            .from('profiles')
            .update({ username, full_name: fullName || null })
            .eq('id', currentUser.id);
        if (error) {
            msg.textContent = 'Ошибка: ' + error.message;
            msg.className = 'msg error';
            msg.style.display = 'block';
        } else {
            msg.textContent = 'Данные обновлены успешно!';
            msg.className = 'msg success';
            msg.style.display = 'block';
            currentProfile.username = username;
            currentProfile.full_name = fullName;
        }
    });

    // Смена пароля (простой диалог)
    document.getElementById('changePasswordBtn').addEventListener('click', async function() {
        const newPassword = prompt('Введите новый пароль (мин. 6 символов):');
        if (!newPassword) return;
        if (newPassword.length < 6) {
            alert('Пароль должен быть не менее 6 символов.');
            return;
        }
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) {
            alert('Ошибка: ' + error.message);
        } else {
            alert('Пароль успешно изменён!');
        }
    });

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', async function() {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });

    // Загрузка аватара (простой вариант)
    document.getElementById('avatarInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        // Загружаем в Supabase Storage
        const fileExt = file.name.split('.').pop();
        const fileName = `${currentUser.id}/avatar.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage
            .from('attachments')
            .upload(fileName, file, { upsert: true });
        if (uploadError) {
            alert('Ошибка загрузки аватара: ' + uploadError.message);
            return;
        }
        const { data: urlData } = supabaseClient.storage
            .from('attachments')
            .getPublicUrl(fileName);
        const avatarUrl = urlData.publicUrl;
        // Обновляем профиль
        const { error: updateError } = await supabaseClient
            .from('profiles')
            .update({ avatar_url: avatarUrl })
            .eq('id', currentUser.id);
        if (updateError) {
            alert('Ошибка обновления аватара: ' + updateError.message);
        } else {
            updateAvatar(avatarUrl);
            alert('Аватар обновлён!');
        }
    });

    // Запуск
    checkAuth();
</script>
</body>
</html>
