# admin/config.yml

# Настройка бэкенда — используется Git Gateway от Netlify
backend:
  name: git-gateway
  branch: main

# Папка для загружаемых изображений
media_folder: 'assets/uploads'
public_folder: '/assets/uploads'

# Локализация интерфейса CMS на русский язык
locale: 'ru'

# ===== КОЛЛЕКЦИИ (РАЗДЕЛЫ САЙТА) =====
collections:

  # -------- 1. НОВОСТИ --------
  - name: 'news'
    label: 'Новости'
    label_singular: 'Новость'
    folder: '_content/news/'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Заголовок', name: 'title', widget: 'string' }
      - { label: 'Дата публикации', name: 'date', widget: 'datetime' }
      - { label: 'Текст новости', name: 'body', widget: 'markdown' }
      - { label: 'Изображение', name: 'image', widget: 'image', required: false }

  # -------- 2. ПРОГРАММЫ --------
  - name: 'programs'
    label: 'Программы'
    label_singular: 'Программа'
    folder: '_content/programs/'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Название программы', name: 'title', widget: 'string' }
      - { label: 'Краткое описание', name: 'description', widget: 'text' }
      - { label: 'Версия', name: 'version', widget: 'string', required: false }
      - { label: 'Размер (МБ)', name: 'size', widget: 'number', required: false }
      - { label: 'Ссылка для скачивания', name: 'download_link', widget: 'string' }
      - { label: 'Иконка', name: 'image', widget: 'image', required: false }

  # -------- 3. КНИГИ --------
  - name: 'books'
    label: 'Книги'
    label_singular: 'Книга'
    folder: '_content/books/'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Название книги', name: 'title', widget: 'string' }
      - { label: 'Автор', name: 'author', widget: 'string' }
      - { label: 'Описание', name: 'description', widget: 'text' }
      - { label: 'Формат', name: 'format', widget: 'string', default: 'PDF' }
      - { label: 'Ссылка для скачивания', name: 'download_link', widget: 'string' }
      - { label: 'Обложка', name: 'cover', widget: 'image', required: false }

  # -------- 4. СТАТЬИ --------
  - name: 'articles'
    label: 'Статьи'
    label_singular: 'Статья'
    folder: '_content/articles/'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Заголовок статьи', name: 'title', widget: 'string' }
      - { label: 'Дата публикации', name: 'date', widget: 'datetime' }
      - { label: 'Текст статьи', name: 'body', widget: 'markdown' }
      - { label: 'Изображение', name: 'image', widget: 'image', required: false }

  # -------- 5. РАЗНОЕ --------
  - name: 'misc'
    label: 'Разное'
    label_singular: 'Материал'
    folder: '_content/misc/'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Название', name: 'title', widget: 'string' }
      - { label: 'Описание', name: 'description', widget: 'text' }
      - { label: 'Ссылка для скачивания', name: 'download_link', widget: 'string' }
      - { label: 'Изображение', name: 'image', widget: 'image', required: false }
