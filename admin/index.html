<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор контента</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            background: #f0f4ff; color: #1a202c;
            padding: 20px;
        }
        .box {
            max-width: 500px; background: white;
            border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,20,80,0.08);
            text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 12px; color: #0f172a; }
        p { color: #64748b; font-size: 15px; line-height: 1.6; }
        a {
            display: inline-block; margin-top: 20px;
            padding: 10px 24px; background: #2563eb; color: white;
            text-decoration: none; border-radius: 30px; font-weight: 600;
            transition: 0.2s;
        }
        a:hover { background: #1d4ed8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <h1>📝 Редактор контента</h1>
        <p>
            Редактирование контента производится через <strong>Google Sheets</strong>.
            После правок запустите workflow <em>«Update content from Google Sheets»</em>
            в GitHub Actions — сайт обновится автоматически.
        </p>
        <a href="../admin-panel.html">← Вернуться в админ-панель</a>
    </div>
</body>
</html>
