<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления сайтом</title>
    <!-- Виджет для входа через Netlify Identity (не используется, но оставлен для совместимости) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        /* Плавающая кнопка "На главную" */
        #backToSiteBtn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999999;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            background: #2563eb;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        #backToSiteBtn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55);
        }
        #backToSiteBtn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        /* На мобильных — чуть компактнее */
        @media (max-width: 600px) {
            #backToSiteBtn {
                bottom: 14px;
                right: 14px;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Плавающая кнопка "На главную" -->
    <a href="/" id="backToSiteBtn" title="Вернуться на основной сайт">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10" />
        </svg>
        На главную
    </a>

    <!-- Загрузка Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
